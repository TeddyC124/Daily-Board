<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Daily Board</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --bg:#11161B;
    --board:#123832;
    --board-hi:#184A42;
    --tile-line:#0B2622;
    --gold:#E8B84B;
    --gold-dim:#7A6027;
    --cream:#F3EFE3;
    --coral:#E2574C;
    --coral-dim:#5c2b26;
    --dim:#8FA39C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:'Space Mono', monospace;
    min-height:100vh;
    padding:20px 14px 60px;
    display:flex;
    justify-content:center;
  }
  .wrap{width:100%;max-width:760px;}
  h1,h2,h3{font-family:'Teko', sans-serif;font-weight:600;letter-spacing:0.02em;margin:0;}

  .masthead{
    display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:2px solid var(--gold);padding-bottom:8px;margin-bottom:14px;
  }
  .masthead h1{font-size:38px;color:var(--cream);line-height:1;}
  .masthead h1 span{color:var(--gold);}
  .masthead .tag{font-size:11px;color:var(--dim);letter-spacing:0.08em;}

  .panel{background:#182229;border:1px solid #223038;border-radius:6px;padding:14px;margin-bottom:14px;}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    font-family:'Space Mono',monospace;font-size:12px;color:var(--dim);
    background:transparent;border:1px solid #2b3a42;border-radius:100px;
    padding:6px 12px;cursor:pointer;
  }
  .chip:hover{border-color:var(--dim);color:var(--cream);}
  .chip.active{border-color:var(--gold);color:var(--gold);background:#E8B84B14;}
  .daily-badge{
    display:inline-block;font-size:10px;letter-spacing:0.1em;color:#11161B;
    background:var(--gold);padding:2px 8px;border-radius:3px;margin-left:8px;
    vertical-align:middle;transform:translateY(-2px);
  }
  .board-title{font-size:24px;}
  .board-sub{font-size:12px;color:var(--dim);margin-top:2px;}

  .scoreboard{display:flex;gap:1px;background:#223038;border:1px solid #223038;border-radius:6px;overflow:hidden;margin-bottom:14px;}
  .sb-cell{flex:1;background:#182229;padding:10px 8px;text-align:center;}
  .sb-label{font-size:10px;color:var(--dim);letter-spacing:0.08em;}
  .sb-value{font-family:'Teko',sans-serif;font-size:28px;color:var(--gold);line-height:1.1;}
  .sb-value.neg{color:var(--coral);}

  .board{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:4px;
    background:var(--tile-line);
    border:2px solid var(--tile-line);
    border-radius:6px;
    overflow:hidden;
    margin-bottom:14px;
  }
  .cat-head{
    background:#0E2925;color:var(--cream);
    font-family:'Teko',sans-serif;font-size:14px;line-height:1.15;
    text-align:center;padding:8px 4px;min-height:56px;
    display:flex;align-items:center;justify-content:center;
    letter-spacing:0.02em;
  }
  .cell{
    background:var(--board);
    color:var(--gold);
    font-family:'Teko',sans-serif;
    font-size:26px;
    text-align:center;
    padding:16px 4px;
    cursor:pointer;
    transition:background .12s;
  }
  .cell:hover{background:var(--board-hi);}
  .cell.used{background:#0E1A18;color:#31423d;cursor:default;}
  .cell.used:hover{background:#0E1A18;}
  .cell.right{color:var(--gold);}
  @media (max-width:520px){
    .board{grid-template-columns:repeat(3,1fr);}
    .cat-head{font-size:12px;min-height:44px;}
    .cell{font-size:20px;padding:12px 4px;}
  }

  .overlay{
    position:fixed;inset:0;background:#0b0f13ee;
    display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .clue-card{
    background:var(--board);border:1px solid var(--board-hi);border-radius:10px;
    max-width:520px;width:100%;padding:28px 24px;text-align:center;
  }
  .clue-cat{font-size:12px;color:var(--gold);letter-spacing:0.1em;margin-bottom:4px;}
  .clue-value{font-family:'Teko',sans-serif;font-size:20px;color:var(--dim);margin-bottom:14px;}
  .clue-text{font-size:18px;line-height:1.5;color:var(--cream);margin-bottom:20px;}
  .answer-text{font-size:16px;color:var(--gold);margin-bottom:20px;display:none;}
  .clue-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}

  button{
    font-family:'Space Mono',monospace;font-size:13px;border-radius:6px;
    border:1px solid #2b3a42;cursor:pointer;padding:10px 18px;
    background:transparent;color:var(--cream);
  }
  button:hover:not(:disabled){border-color:var(--dim);}
  button:disabled{opacity:0.4;cursor:default;}
  button.primary{background:var(--gold);color:#11161B;border-color:var(--gold);font-weight:700;}
  button.primary:hover{background:#f5cd6f;}
  button.right-btn{border-color:var(--gold-dim);color:var(--gold);}
  button.wrong-btn{border-color:var(--coral-dim);color:var(--coral);}

  .wager-row{display:flex;gap:8px;justify-content:center;margin-top:14px;}
  input[type=number],input[type=text]{
    background:#0E1A18;border:1px solid #2b3a42;border-radius:6px;color:var(--cream);
    font-family:'Space Mono',monospace;font-size:14px;padding:10px;width:140px;text-align:center;
  }
  input:focus{outline:none;border-color:var(--gold);}

  .end-panel{text-align:center;}
  .end-title{font-size:34px;color:var(--gold);}
  .end-sub{font-size:13px;color:var(--dim);margin-bottom:14px;}
  .end-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}

  .stats-row{display:flex;gap:1px;background:#223038;border:1px solid #223038;border-radius:6px;overflow:hidden;margin-top:14px;}
  .stats-row .sb-cell .sb-value{font-size:22px;color:var(--cream);}

  footer{text-align:center;font-size:11px;color:var(--dim);margin-top:20px;}
</style>
</head>

function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function dailyBoardIndex(){
  const start = new Date(2026,0,1).getTime();
  const days = Math.floor((Date.now() - start) / 86400000);
  return ((days % BOARDS.length) + BOARDS.length) % BOARDS.length;
}

let state = null;

function newGame(boardIndex, isDaily){
  state = {
    boardIndex,
    isDaily,
    score: 0,
    used: new Set(),          // "catIdx-clueIdx"
    totalClues: BOARDS[boardIndex].categories.length * BOARDS[boardIndex].categories[0].clues.length,
    finalDone: false,
    over: false,
    active: null,             // { catIdx, clueIdx, wager } while a clue overlay is open
  };
  render();
}

function board(){ return BOARDS[state.boardIndex]; }

function openClue(catIdx, clueIdx){
  const key = catIdx + '-' + clueIdx;
  if (state.used.has(key)) return;
  const clueObj = board().categories[catIdx].clues[clueIdx];
  state.active = { catIdx, clueIdx, wager: clueObj.dailyDouble ? null : clueObj.value };
  renderOverlay();
}

function closeClueAndGrade(correct){
  const { catIdx, clueIdx, wager } = state.active;
  const key = catIdx + '-' + clueIdx;
  state.used.add(key);
  const amount = wager != null ? wager : board().categories[catIdx].clues[clueIdx].value;
  state.score += correct ? amount : -amount;
  state.active = null;

  if (state.used.size === state.totalClues) {
    openFinal();
  } else {
    render();
  }
}

function setDailyDoubleWager(amount){
  state.active.wager = amount;
  renderOverlay();
}

function openFinal(){
  state.active = { final: true, wager: null, revealed: false };
  renderOverlay();
}

function setFinalWager(amount){
  state.active.wager = amount;
  renderOverlay();
}

function finishFinal(correct){
  const amount = state.active.wager || 0;
  state.score += correct ? amount : -amount;
  state.active = null;
  state.finalDone = true;
  state.over = true;
  recordResult();
  render();
}

async function recordResult(){
  if (!state.isDaily) return;
  try {
    let stats = { played: 0, best: null };
    try {
      const r = await window.storage.get('trivia-board-stats', false);
      if (r && r.value) stats = JSON.parse(r.value);
    } catch(e) {}
    stats.played = (stats.played || 0) + 1;
    stats.best = stats.best == null ? state.score : Math.max(stats.best, state.score);
    await window.storage.set('trivia-board-stats', JSON.stringify(stats), false);
    renderStats(stats);
  } catch(e) { console.error('storage error', e); }
}

async function loadStats(){
  try {
    const r = await window.storage.get('trivia-board-stats', false);
    if (r && r.value) renderStats(JSON.parse(r.value));
  } catch(e) {}
}

function renderStats(stats){
  document.getElementById('statsRow').style.display = 'flex';
  document.getElementById('statPlayed').textContent = stats.played || 0;
  document.getElementById('statBest').textContent = '$' + (stats.best ?? 0).toLocaleString();
}

function renderChips(){
  const row = document.getElementById('boardChips');
  row.innerHTML = '';
  BOARDS.forEach((b, i) => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (state.boardIndex === i ? ' active' : '');
    chip.textContent = b.title;
    chip.onclick = () => newGame(i, i === dailyBoardIndex());
    row.appendChild(chip);
  });
}

function renderBoardGrid(){
  const b = board();
  const area = document.getElementById('boardArea');
  if (state.over){ area.innerHTML = ''; return; }

  const grid = document.createElement('div');
  grid.className = 'board';

  b.categories.forEach(cat => {
    const head = document.createElement('div');
    head.className = 'cat-head';
    head.textContent = cat.name;
    grid.appendChild(head);
  });

  const rows = b.categories[0].clues.length;
  for (let r = 0; r < rows; r++){
    b.categories.forEach((cat, catIdx) => {
      const clueObj = cat.clues[r];
      const key = catIdx + '-' + r;
      const cell = document.createElement('div');
      cell.className = 'cell' + (state.used.has(key) ? ' used' : '');
      cell.textContent = state.used.has(key) ? '' : '$' + clueObj.value;
      if (!state.used.has(key)) cell.onclick = () => openClue(catIdx, r);
      grid.appendChild(cell);
    });
  }
  area.innerHTML = '';
  area.appendChild(grid);
}

function renderOverlay(){
  let existing = document.getElementById('overlay');
  if (existing) existing.remove();
  if (!state.active) return;

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'overlay';

  if (state.active.final){
    const f = board().final;
    if (state.active.wager == null){
      overlay.innerHTML = `
        <div class="clue-card">
          <div class="clue-cat">FINAL — ${f.category}</div>
          <div class="clue-value">Wager how much of your $${Math.max(state.score,0)} score?</div>
          <div class="wager-row">
            <input type="number" id="finalWagerInput" min="0" max="${Math.max(state.score,0)}" value="0">
            <button class="primary" id="finalWagerBtn">Lock in wager</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      document.getElementById('finalWagerBtn').onclick = () => {
        const v = Math.max(0, Math.min(Math.max(state.score,0), parseInt(document.getElementById('finalWagerInput').value) || 0));
        setFinalWager(v);
      };
      return;
    }
    overlay.innerHTML = `
      <div class="clue-card">
        <div class="clue-cat">FINAL — ${f.category}</div>
        <div class="clue-value">Wager: $${state.active.wager}</div>
        <div class="clue-text">${f.clue}</div>
        <div class="answer-text" id="answerText">${f.answer}</div>
        <div class="clue-actions" id="clueActions">
          <button class="primary" id="revealBtn">Reveal answer</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    document.getElementById('revealBtn').onclick = () => {
      document.getElementById('answerText').style.display = 'block';
      document.getElementById('clueActions').innerHTML = `
        <button class="right-btn" id="rightBtn">I got it right</button>
        <button class="wrong-btn" id="wrongBtn">I got it wrong</button>`;
      document.getElementById('rightBtn').onclick = () => finishFinal(true);
      document.getElementById('wrongBtn').onclick = () => finishFinal(false);
    };
    return;
  }

  const { catIdx, clueIdx } = state.active;
  const cat = board().categories[catIdx];
  const clueObj = cat.clues[clueIdx];

  if (clueObj.dailyDouble && state.active.wager == null){
    const maxWager = Math.max(state.score, 1000);
    overlay.innerHTML = `
      <div class="clue-card">
        <div class="clue-cat">DAILY DOUBLE — ${cat.name}</div>
        <div class="clue-value">Wager between $5 and $${maxWager}</div>
        <div class="wager-row">
          <input type="number" id="ddWagerInput" min="5" max="${maxWager}" value="${Math.min(1000,maxWager)}">
          <button class="primary" id="ddWagerBtn">Lock in wager</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    document.getElementById('ddWagerBtn').onclick = () => {
      const v = Math.max(5, Math.min(maxWager, parseInt(document.getElementById('ddWagerInput').value) || 5));
      setDailyDoubleWager(v);
    };
    return;
  }

  overlay.innerHTML = `
    <div class="clue-card">
      <div class="clue-cat">${cat.name}${clueObj.dailyDouble ? ' — DAILY DOUBLE' : ''}</div>
      <div class="clue-value">${clueObj.dailyDouble ? 'Wager: $' + state.active.wager : '$' + clueObj.value}</div>
      <div class="clue-text">${clueObj.clue}</div>
      <div class="answer-text" id="answerText">${clueObj.answer}</div>
      <div class="clue-actions" id="clueActions">
        <button class="primary" id="revealBtn">Reveal answer</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('revealBtn').onclick = () => {
    document.getElementById('answerText').style.display = 'block';
    document.getElementById('clueActions').innerHTML = `
      <button class="right-btn" id="rightBtn">I got it right</button>
      <button class="wrong-btn" id="wrongBtn">I got it wrong</button>`;
    document.getElementById('rightBtn').onclick = () => closeClueAndGrade(true);
    document.getElementById('wrongBtn').onclick = () => closeClueAndGrade(false);
  };
}

function renderEnd(){
  const endArea = document.getElementById('endArea');
  if (!state.over){ endArea.style.display = 'none'; return; }
  endArea.style.display = 'block';
  const b = board();
  const title = state.score >= 3000 ? 'CHAMPION' : state.score >= 1000 ? 'SOLID GAME' : state.score >= 0 ? 'IN THE BLACK' : 'TOUGH BOARD';
  endArea.innerHTML = `
    <div class="panel end-panel">
      <div class="end-title">${title}</div>
      <div class="end-sub">Final score on ${b.title}: $${state.score.toLocaleString()}</div>
      <div class="end-actions">
        <button class="primary" id="nextBoardBtn">Play another board</button>
      </div>
    </div>`;
  document.getElementById('nextBoardBtn').onclick = () => {
    const next = (state.boardIndex + 1) % BOARDS.length;
    newGame(next, false);
  };
}

function render(){
  renderChips();
  const b = board();
  document.getElementById('boardTitle').innerHTML = `
    <div class="board-title">${b.title}${state.isDaily ? '<span class="daily-badge">DAILY</span>' : ''}</div>
    <div class="board-sub">6 categories &middot; one Daily Double &middot; Final round</div>
  `;
  document.getElementById('scoreDisplay').textContent = '$' + state.score.toLocaleString();
  document.getElementById('scoreDisplay').className = 'sb-value' + (state.score < 0 ? ' neg' : '');
  document.getElementById('cluesLeft').textContent = state.totalClues - state.used.size;
  renderBoardGrid();
  renderOverlay();
  renderEnd();
}

newGame(dailyBoardIndex(), true);
loadStats();
</script>
</body>
</html>
